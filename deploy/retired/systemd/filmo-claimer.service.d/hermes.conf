[Service]
# Selects the Hermes-conducted produce path: the produce step is driven by the
# Hermes agent inside the NemoClaw sandbox (the 5 filmo-host MCP tools), tagging
# delivered runs producer=hetzner-hermes. On ANY conduct failure/timeout the
# claimer falls back to the deterministic build_runner, so a render never fails.
# Set CLAIMER_MODE=direct (or remove this drop-in) to force the deterministic path.
Environment=CLAIMER_MODE=hermes
