# Added 2026-06-29: warm the OpenShell/NemoClaw gateway before the worker claims,
# so the FIRST hermes conduct after a reboot/gateway-crash doesn't cold-fail
# ("Connection refused") into the curated fallback. Idempotent: no-op when warm.
[Service]
ExecStartPre=-/root/filmo-worker/prewarm-gateway.sh
TimeoutStartSec=180
