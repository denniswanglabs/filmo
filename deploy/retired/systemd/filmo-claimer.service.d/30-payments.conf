[Service]
# Pre-conduct Stripe TEST payment gate. PAYMENTS_REQUIRED=true (default) makes a
# pay_mode=human job STOP and prompt for a real Stripe TEST checkout (4242) before
# producing. REVERSIBILITY KILL-SWITCH: set this to false + restart to instantly
# fall back to auto-proceed (no gate). FILMO_PUBLIC_BASE pins the checkout
# success/cancel returns to the live run page.
Environment=PAYMENTS_REQUIRED=true
Environment=FILMO_PUBLIC_BASE=https://filmostudio.vercel.app
