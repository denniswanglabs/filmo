# Added 2026-06-29: the OpenShell/NemoClaw Docker-driver gateway (spawned by
# curated-claimer.js -> `nemoclaw filmo exec`, env: process.env) aborts with
# "Error: × HOME is not set" when the unit runs without HOME, so the hermes
# conduct fails at [2/8] and silently falls back to the deterministic
# build_runner (delivers producer=hetzner-curated instead of hetzner-hermes).
# HOME lets nemoclaw resolve ~/.nemoclaw + ~/.config/openshell; the XDG_* lines
# pin the dirs that already hold the gateway metadata / state (defaults of HOME).
[Service]
Environment=HOME=/root
Environment=XDG_CONFIG_HOME=/root/.config
Environment=XDG_STATE_HOME=/root/.local/state
Environment=XDG_DATA_HOME=/root/.local/share
Environment=XDG_CACHE_HOME=/root/.cache
