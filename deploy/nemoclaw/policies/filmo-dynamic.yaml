preset:
  name: filmo-dynamic
  description: "Per-job target host (rewritten per build)"
# This file is the PLACEHOLDER. The host worker (worker.js / curated-claimer.js)
# OVERWRITES it per job with the SSRF-vetted target host, then runs
#   nemoclaw filmo policy-add filmo-dynamic --from-file <this> --yes
# so the sandbox can only reach the one customer URL that was approved for the
# current build. The vercel.com entry below is just the committed default.
network_policies:
  filmo-dynamic:
    name: filmo-dynamic
    endpoints:
      - { host: vercel.com, port: 443, access: full }
      - { host: www.vercel.com, port: 443, access: full }
    binaries:
      - { path: "/**" }
