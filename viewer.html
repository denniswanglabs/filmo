<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Filmo — Agent Activity</title>
<style>
  :root { --bg:#0B0D12; --card:#151922; --card2:#1B2130; --ink:#EDF1F7;
          --muted:#8B94A7; --accent:#F97316; --read:#60A5FA; --film:#F87171;
          --ok:#34D399; --border:rgba(255,255,255,0.07); }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink);
         font:15px/1.5 Inter,-apple-system,sans-serif; }
  header { position:sticky; top:0; background:rgba(11,13,18,0.92);
           backdrop-filter:blur(12px); border-bottom:1px solid var(--border);
           padding:16px 28px; display:flex; align-items:center; gap:14px; z-index:5; }
  .dot { width:10px; height:10px; border-radius:5px; background:var(--muted); }
  .dot.live { background:var(--ok); animation:pulse 1.6s infinite; }
  .dot.error { background:var(--film); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  h1 { font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:860px; margin:0 auto; padding:28px 20px 80px; }
  .evt { display:flex; gap:16px; padding:14px 0; }
  .rail { width:34px; display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .pip { width:12px; height:12px; border-radius:6px; margin-top:5px; flex-shrink:0; }
  .line { width:2px; flex:1; background:var(--border); margin-top:6px; }
  .card { flex:1; background:var(--card); border:1px solid var(--border);
          border-radius:14px; padding:14px 18px; }
  .kind { font-size:11px; font-weight:700; letter-spacing:0.08em;
          text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .title { font-weight:600; }
  .detail { color:var(--muted); font-size:13.5px; margin-top:3px; white-space:pre-wrap; }
  .art { margin-top:12px; border-radius:10px; overflow:hidden;
         border:1px solid var(--border); max-width:520px; }
  .art img, .art video { width:100%; display:block; }
  .t { color:var(--muted); font-size:11.5px; margin-top:6px; }
  .lane-read .pip { background:var(--read); }
  .lane-decide .pip { background:var(--accent); }
  .lane-film .pip { background:var(--film); }
  .lane-run .pip { background:var(--ok); }
  .lane-assemble .pip { background:#A78BFA; }
  .lane-decide .kind { color:var(--accent); }
  .lane-read .kind { color:var(--read); }
  .lane-film .kind { color:var(--film); }
  .lane-run .kind { color:var(--ok); }
  .lane-assemble .kind { color:#A78BFA; }
  #wait { color:var(--muted); font-size:13px; padding:18px 0 0 50px; display:none; }
  #pip { position:fixed; right:22px; bottom:22px; width:400px; z-index:9;
         background:var(--card2); border:1px solid var(--border); border-radius:14px;
         overflow:hidden; box-shadow:0 30px 70px -30px rgba(0,0,0,0.7); display:none; }
  #pip .bar { display:flex; align-items:center; gap:8px; padding:9px 12px;
              border-bottom:1px solid var(--border); font-size:12px; font-weight:700;
              letter-spacing:0.06em; color:var(--muted); }
  #pip .rec { width:9px; height:9px; border-radius:5px; background:var(--film);
              animation:pulse 1.1s infinite; }
  #pip img { width:100%; display:block; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <div>
    <h1 id="runname">Agent activity</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
</header>
<div id="pip">
  <div class="bar"><div class="rec"></div>LIVE — THE AGENT'S VIEWPORT</div>
  <img id="pipimg">
</div>
<main>
  <div id="feed"></div>
  <div id="wait">The agent is still working — renders and captures can take a few minutes.</div>
</main>
<script>
const run = new URLSearchParams(location.search).get("run") || "";
document.getElementById("runname").textContent = run || "no run selected";
let last = -1, lastTs = 0, done = false;
const feed = document.getElementById("feed");
const LANES = { run:"run", read:"read", decide:"decide", film:"film", assemble:"assemble" };

function laneOf(kind) { return LANES[kind.split(".")[0]] || "run"; }
function fmt(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

function render(e) {
  const lane = laneOf(e.kind);
  const div = document.createElement("div");
  div.className = "evt lane-" + lane;
  let art = "";
  if (e.artifact) {
    const src = "/" + e.artifact;
    art = e.artifact.endsWith(".mp4")
      ? `<div class="art"><video src="${src}" muted autoplay loop playsinline></video></div>`
      : `<div class="art"><img src="${src}" loading="lazy"></div>`;
  }
  div.innerHTML = `
    <div class="rail"><div class="pip"></div><div class="line"></div></div>
    <div class="card">
      <div class="kind">${e.kind}</div>
      <div class="title">${e.title}</div>
      ${e.detail ? `<div class="detail">${e.detail}</div>` : ""}
      ${art}
      <div class="t">${fmt(e.ts)}</div>
    </div>`;
  feed.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

async function poll() {
  if (done) return;
  try {
    const r = await fetch(`/events/${run}?after=${last}`);
    const evts = await r.json();
    for (const e of evts) {
      render(e); last = e.seq; lastTs = e.ts;
      if (e.kind === "run.done") setStatus("finished", "");
      if (e.kind === "run.error") setStatus("failed", "error");
      if (e.kind === "run.done" || e.kind === "run.error") done = true;
    }
    if (!done) {
      const age = lastTs ? (Date.now() / 1000 - lastTs) : 0;
      setStatus(age > 20 ? "working — long step in progress" : "live", "live");
      document.getElementById("wait").style.display = age > 20 ? "block" : "none";
    } else {
      document.getElementById("wait").style.display = "none";
    }
  } catch (err) { setStatus("waiting for run…", ""); }
  setTimeout(poll, 1000);
}
function setStatus(text, cls) {
  document.getElementById("status").textContent = text;
  document.getElementById("dot").className = "dot " + cls;
}
poll();

// LIVE VIEWPORT: show the agent's screen whenever a fresh frame exists.
const pip = document.getElementById("pip"), pipimg = document.getElementById("pipimg");
async function livePoll() {
  try {
    const r = await fetch(`/live/${run}?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) {
      const blob = await r.blob();
      const old = pipimg.dataset.url;
      pipimg.src = pipimg.dataset.url = URL.createObjectURL(blob);
      if (old) URL.revokeObjectURL(old);
      pip.style.display = "block";
    } else {
      pip.style.display = "none";
    }
  } catch (e) { pip.style.display = "none"; }
  setTimeout(livePoll, 320);
}
livePoll();
</script>
</body>
</html>
