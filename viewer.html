<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Filmo — Agent Activity</title>
<style>
  /* Filmo design language: light world, ink #0A0B0D, accent blue #3B82F6,
     soft-blue tints, dotted texture (mirrors web/app/globals.css). */
  :root { --bg:#FFFFFF; --ink:#0A0B0D; --muted:#5A6472; --accent:#3B82F6;
          --soft:#E8F0FF; --line:#D4E2FB; --card:#FFFFFF;
          --read:#0EA5E9; --film:#EF4444; --ok:#10B981; --design:#8B5CF6; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink);
         font:15px/1.5 Inter,-apple-system,sans-serif;
         background-image:radial-gradient(rgba(59,130,246,0.10) 1px, transparent 1px);
         background-size:22px 22px; }
  header { position:sticky; top:0; z-index:5;
           background:rgba(255,255,255,0.88); backdrop-filter:blur(12px);
           border-bottom:1px solid var(--line);
           padding:14px 28px; display:flex; align-items:center; gap:14px; }
  #mark { width:34px; height:34px; flex-shrink:0; }
  #mark.live { animation:spinbreathe 2.6s ease-in-out infinite; }
  @keyframes spinbreathe {
    0%   { transform:rotate(0deg)   scale(1); }
    50%  { transform:rotate(180deg) scale(0.86); }
    100% { transform:rotate(360deg) scale(1); }
  }
  h1 { font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:860px; margin:0 auto; padding:28px 20px 90px; }
  .evt { display:flex; gap:16px; padding:13px 0; }
  .rail { width:34px; display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .pip { width:12px; height:12px; border-radius:6px; margin-top:5px; flex-shrink:0; }
  .rline { width:2px; flex:1; background:var(--line); margin-top:6px; }
  .card { flex:1; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:14px 18px;
          box-shadow:0 10px 30px -18px rgba(59,130,246,0.25); }
  .kind { font-size:11px; font-weight:700; letter-spacing:0.08em;
          text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .title { font-weight:600; }
  .detail { color:var(--muted); font-size:13.5px; margin-top:3px; white-space:pre-wrap; }
  .art { margin-top:12px; border-radius:10px; overflow:hidden;
         border:1px solid var(--line); max-width:520px; }
  .art img, .art video { width:100%; display:block; }
  .t { color:var(--muted); font-size:11.5px; margin-top:6px; }
  .lane-read .pip { background:var(--read); }      .lane-read .kind { color:var(--read); }
  .lane-decide .pip { background:var(--accent); }  .lane-decide .kind { color:var(--accent); }
  .lane-film .pip { background:var(--film); }      .lane-film .kind { color:var(--film); }
  .lane-run .pip { background:var(--ok); }         .lane-run .kind { color:var(--ok); }
  .lane-assemble .pip { background:var(--design); }.lane-assemble .kind { color:var(--design); }
  .lane-design .pip { background:var(--design); }  .lane-design .kind { color:var(--design); }
  .lane-review .pip { background:#F59E0B; }        .lane-review .kind { color:#F59E0B; }
  #wait { color:var(--muted); font-size:13px; padding:18px 0 0 50px; display:none; }
  #pip { position:fixed; right:22px; bottom:22px; width:400px; z-index:9;
         background:var(--card); border:1px solid var(--line); border-radius:14px;
         overflow:hidden; box-shadow:0 30px 70px -30px rgba(10,11,13,0.35); display:none; }
  #pip .bar { display:flex; align-items:center; gap:8px; padding:9px 12px;
              border-bottom:1px solid var(--line); font-size:12px; font-weight:700;
              letter-spacing:0.06em; color:var(--muted); }
  #pip .rec { width:9px; height:9px; border-radius:5px; background:var(--film);
              animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  #pip img { width:100%; display:block; }
</style>
</head>
<body>
<header>
  <svg id="mark" viewBox="14 13 56 56" xmlns="http://www.w3.org/2000/svg">
    <path fill-rule="evenodd" fill="#3B82F6" d="M42 17 C56 15 67 27 65 41 C63 55 52 67 38 65 C25 63 16 51 19 37 C21 25 30 19 42 17 Z M47 28.5 A8.5 8.5 0 1 1 47 45.5 A8.5 8.5 0 1 1 47 28.5 Z"/>
  </svg>
  <div>
    <h1 id="runname">Agent activity</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
</header>
<div id="pip">
  <div class="bar"><div class="rec"></div>LIVE — THE AGENT'S VIEWPORT</div>
  <img id="pipimg">
</div>
<main>
  <div id="feed"></div>
  <div id="wait">The agent is still working — renders and captures can take a few minutes.</div>
</main>
<script>
const run = new URLSearchParams(location.search).get("run") || "";
document.getElementById("runname").textContent = run || "no run selected";
let last = -1, lastTs = 0, done = false;
const feed = document.getElementById("feed");
const LANES = { run:"run", read:"read", decide:"decide", film:"film",
                assemble:"assemble", design:"design", review:"review" };

function laneOf(kind) { return LANES[kind.split(".")[0]] || "run"; }
function fmt(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

function render(e) {
  const lane = laneOf(e.kind);
  const div = document.createElement("div");
  div.className = "evt lane-" + lane;
  let art = "";
  if (e.artifact) {
    const src = "/" + e.artifact;
    art = e.artifact.endsWith(".mp4")
      ? `<div class="art"><video src="${src}" muted autoplay loop playsinline></video></div>`
      : `<div class="art"><img src="${src}" loading="lazy"></div>`;
  }
  div.innerHTML = `
    <div class="rail"><div class="pip"></div><div class="rline"></div></div>
    <div class="card">
      <div class="kind">${e.kind}</div>
      <div class="title">${e.title}</div>
      ${e.detail ? `<div class="detail">${e.detail}</div>` : ""}
      ${art}
      <div class="t">${fmt(e.ts)}</div>
    </div>`;
  feed.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

const mark = document.getElementById("mark");
async function poll() {
  if (done) return;
  try {
    const r = await fetch(`/events/${run}?after=${last}`);
    const evts = await r.json();
    for (const e of evts) {
      render(e); last = e.seq; lastTs = e.ts;
      if (e.kind === "run.done") setStatus("finished", false);
      if (e.kind === "run.error") setStatus("failed", false);
      if (e.kind === "run.done" || e.kind === "run.error") done = true;
    }
    if (!done) {
      const age = lastTs ? (Date.now() / 1000 - lastTs) : 0;
      setStatus(age > 20 ? "working — long step in progress" : "live", true);
      document.getElementById("wait").style.display = age > 20 ? "block" : "none";
    } else {
      document.getElementById("wait").style.display = "none";
    }
  } catch (err) { setStatus("waiting for run…", false); }
  setTimeout(poll, 1000);
}
function setStatus(text, live) {
  document.getElementById("status").textContent = text;
  mark.className = live ? "live" : "";
}
poll();

// LIVE VIEWPORT: show the agent's screen whenever a fresh frame exists.
const pip = document.getElementById("pip"), pipimg = document.getElementById("pipimg");
async function livePoll() {
  try {
    const r = await fetch(`/live/${run}?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) {
      const blob = await r.blob();
      const old = pipimg.dataset.url;
      pipimg.src = pipimg.dataset.url = URL.createObjectURL(blob);
      if (old) URL.revokeObjectURL(old);
      pip.style.display = "block";
    } else {
      pip.style.display = "none";
    }
  } catch (e) { pip.style.display = "none"; }
  setTimeout(livePoll, 320);
}
livePoll();
</script>
</body>
</html>
