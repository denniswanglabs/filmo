<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Filmo — Agent Run</title>
<style>
  /* Filmo light language. UNCLUTTERED CONTRACT: one focal STAGE whose content
     follows the run's phase (hierarchy through time, not space); one caption
     line; one quiet strip. No scroll, no panel grid. */
  :root { --bg:#FFFFFF; --ink:#0A0B0D; --muted:#5A6472; --accent:#3B82F6;
          --soft:#E8F0FF; --line:#D4E2FB; --ok:#10B981; --film:#EF4444;
          --design:#8B5CF6; --review:#F59E0B; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--ink);
         font:14px/1.5 Inter,-apple-system,sans-serif;
         background-image:radial-gradient(rgba(59,130,246,0.08) 1px, transparent 1px);
         background-size:22px 22px;
         display:flex; flex-direction:column; }
  header { flex:0 0 56px; display:flex; align-items:center; gap:13px;
           padding:0 26px; }
  #mark { width:30px; height:30px; }
  #mark.live { animation:spinbreathe 2.6s ease-in-out infinite; }
  @keyframes spinbreathe {
    0% { transform:rotate(0) scale(1); } 50% { transform:rotate(180deg) scale(0.86); }
    100% { transform:rotate(360deg) scale(1); } }
  h1 { font-size:14px; font-weight:700; }
  .sub { color:var(--muted); font-size:12.5px; }
  #steps { margin-left:auto; display:flex; gap:5px; }
  .step { padding:3px 11px; border-radius:999px; font-size:10.5px;
          font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
          color:#B6BFCE; }
  .step.on { color:#fff; background:var(--accent); }
  .step.done { color:var(--ok); }
  #stagewrap { flex:1; min-height:0; display:flex; flex-direction:column;
               align-items:center; justify-content:center; padding:6px 26px 0; }
  #stage { max-width:1060px; width:100%; flex:1; min-height:0;
           display:flex; align-items:center; justify-content:center; }
  #stage img, #stage video { max-width:100%; max-height:100%; border-radius:16px;
           box-shadow:0 40px 90px -45px rgba(10,11,13,0.5); display:block; }
  #stagegrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;
               width:100%; max-width:1060px; height:100%; grid-auto-rows:1fr; }
  #stagegrid .beat { border-radius:14px; overflow:hidden; min-height:0;
                     box-shadow:0 20px 50px -30px rgba(10,11,13,0.45); }
  #stagegrid .beat img { width:100%; height:100%; object-fit:cover; }
  #stagetext { max-width:720px; text-align:center; }
  #stagetext .big { font-size:26px; font-weight:700; letter-spacing:-0.01em;
                    line-height:1.35; }
  #stagetext .small { color:var(--muted); margin-top:12px; font-size:14px; }
  #caption { flex:0 0 34px; display:flex; align-items:center; gap:9px;
             color:var(--muted); font-size:13px; max-width:1060px;
             width:100%; margin:0 auto; padding:0 26px; }
  .rec { width:8px; height:8px; border-radius:4px; background:var(--film);
         animation:pulse 1.1s infinite; display:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  footer { flex:0 0 96px; display:flex; align-items:center; gap:26px;
           padding:0 26px 16px; max-width:1120px; margin:0 auto; width:100%; }
  #plan { flex:1; display:flex; flex-wrap:wrap; gap:6px; align-content:center; }
  .chip { padding:5px 12px; border-radius:999px; background:#fff;
          border:1px solid var(--line); font-size:11.5px; color:var(--ink);
          white-space:nowrap; max-width:250px; overflow:hidden;
          text-overflow:ellipsis; }
  .chip b { color:var(--design); font-weight:600; }
  #thumbs { display:flex; gap:8px; }
  #thumbs img { height:52px; border-radius:8px; border:1.5px solid var(--line);
                cursor:pointer; display:block; }
  #thumbs img:hover { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <svg id="mark" viewBox="14 13 56 56" xmlns="http://www.w3.org/2000/svg">
    <path fill-rule="evenodd" fill="#3B82F6" d="M42 17 C56 15 67 27 65 41 C63 55 52 67 38 65 C25 63 16 51 19 37 C21 25 30 19 42 17 Z M47 28.5 A8.5 8.5 0 1 1 47 45.5 A8.5 8.5 0 1 1 47 28.5 Z"/>
  </svg>
  <div>
    <h1 id="runname">Agent run</h1>
    <div class="sub" id="status">connecting…</div>
  </div>
  <div id="steps">
    <div class="step" data-s="read">Read</div>
    <div class="step" data-s="decide">Decide</div>
    <div class="step" data-s="film">Film</div>
    <div class="step" data-s="design">Design</div>
    <div class="step" data-s="review">Review</div>
    <div class="step" data-s="done">Done</div>
  </div>
</header>
<div id="stagewrap">
  <div id="stage"></div>
  <div id="caption"><div class="rec" id="recdot"></div><span id="captext"></span></div>
</div>
<footer>
  <div id="plan"></div>
  <div id="thumbs"></div>
</footer>
<script>
const run = new URLSearchParams(location.search).get("run") || "";
document.getElementById("runname").textContent = run || "no run selected";
const $ = (id) => document.getElementById(id);
let evts = [], done = false, lastTs = 0, liveFresh = false, liveUrl = "";
let pinned = null, pinnedUntil = 0;

function reduce() {
  const S = { pages:[], plan:[], treatments:{}, beats:[], review:[],
              film:"", phase:"read", status:"", lastTitle:"" };
  for (const e of evts) {
    const k = e.kind;
    if (k === "read.page") { S.pages.push(e); S.phase = "read"; }
    if (k === "decide.plan") {
      S.plan = e.detail.split("\n").map(s => s.replace(/^\d+\.\s*/, ""));
      S.phase = "decide";
    }
    if (k === "decide.treatments")
      e.detail.split("\n").forEach(l => {
        const m = l.match(/“(.+)”\s*→\s*(.+)/);
        if (m) S.treatments[m[1]] = m[2];
      });
    if (k.startsWith("film.")) S.phase = "film";
    if (k === "design.beat" && e.artifact) { S.beats.push(e); S.phase = "design"; }
    if (k.startsWith("review.")) { S.phase = "review"; if (k !== "review.start") S.review.push(e); }
    if (k === "assemble.film") S.film = e.artifact;
    if (k === "run.done") { S.phase = "done"; S.status = "finished"; }
    if (k === "run.error") { S.phase = "done"; S.status = "failed"; }
    S.lastTitle = e.title;
  }
  return S;
}

const ORDER = ["read", "decide", "film", "design", "review", "done"];
function setStage(html, cap) {
  $("stage").innerHTML = html;
  $("captext").textContent = cap || "";
}

function render() {
  const S = reduce();
  document.querySelectorAll(".step").forEach(el => {
    const i = ORDER.indexOf(el.dataset.s), cur = ORDER.indexOf(S.phase);
    el.className = "step" + (i < cur ? " done" : i === cur ? " on" : "");
  });
  $("status").textContent = done ? (S.status || "finished")
    : (Date.now() / 1000 - lastTs > 20 ? "working" : "live");
  $("mark").className = done ? "" : "live";
  $("recdot").style.display = liveFresh ? "block" : "none";

  // Footer: plan chips + beat thumbnails (quiet, always available).
  $("plan").innerHTML = S.plan.map(t => {
    const tr = S.treatments[t.slice(0, 44)] || S.treatments[t];
    return `<span class="chip">${t}${tr ? ` <b>→ ${tr}</b>` : ""}</span>`;
  }).join("");
  $("thumbs").innerHTML = S.beats.map((b, i) =>
    `<img src="/${b.artifact}" data-i="${i}" title="${b.title}">`).join("");
  document.querySelectorAll("#thumbs img").forEach(im =>
    im.onclick = () => { pinned = S.beats[+im.dataset.i]; pinnedUntil = Date.now() + 8000; render(); });

  // THE STAGE — one focal thing, by phase (or a pinned thumbnail).
  if (pinned && Date.now() < pinnedUntil) {
    setStage(`<img src="/${pinned.artifact}">`,
             `${pinned.title} — ${pinned.detail || ""}`);
    return;
  }
  pinned = null;
  if (liveFresh && !done) {
    setStage(`<img src="${liveUrl}">`, "Recording — the agent's viewport, live.");
    return;
  }
  switch (S.phase) {
    case "read": {
      const p = S.pages[S.pages.length - 1];
      setStage(p && p.artifact ? `<img src="/${p.artifact}">` : "",
               p ? `${p.title} — ${p.detail}` : "The agent is opening the site…");
      break;
    }
    case "decide":
      setStage(`<div id="stagetext"><div class="big">${S.plan.join("<br>")}</div>
                <div class="small">The moments a customer cares about — chosen from the site's own words.</div></div>`,
               "Planning the shot list.");
      break;
    case "film":
      setStage(`<div id="stagetext"><div class="big">${S.lastTitle}</div></div>`,
               "Filming.");
      break;
    case "design": {
      const cells = S.beats.map(b => `<div class="beat"><img src="/${b.artifact}"></div>`).join("");
      setStage(`<div id="stagegrid">${cells}</div>`, "Designing the film, beat by beat.");
      break;
    }
    case "review": {
      const last = S.review[S.review.length - 1];
      setStage(`<div id="stagetext"><div class="big">${last ? last.title : "Reviewing…"}</div>
                <div class="small">${last ? (last.detail || "") : ""}</div></div>`,
               "The reviewer checks story and coherence.");
      break;
    }
    case "done":
      if (S.film) setStage(`<video src="/${S.film}" controls autoplay muted></video>`,
                           S.review.some(e => e.kind === "review.pass")
                             ? "Review passed — this is the shipped cut."
                             : "The finished film.");
      else setStage(`<div id="stagetext"><div class="big">${S.status === "failed" ? "The run failed." : "Finished."}</div></div>`, "");
      break;
  }
}

async function poll() {
  try {
    const r = await fetch(`/events/${run}?after=-1`);
    const all = await r.json();
    if (all.length !== evts.length) {
      evts = all; lastTs = all.length ? all[all.length - 1].ts : 0;
      done = evts.some(e => e.kind === "run.done" || e.kind === "run.error");
      render();
    } else if (!done) { render(); }
  } catch (e) { $("status").textContent = "waiting for run…"; }
  if (!done) setTimeout(poll, 1000);
}
poll();

async function livePoll() {
  try {
    const r = await fetch(`/live/${run}?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) {
      const blob = await r.blob();
      if (liveUrl) URL.revokeObjectURL(liveUrl);
      liveUrl = URL.createObjectURL(blob);
      if (!liveFresh) { liveFresh = true; render(); }
      else if (!pinned) {
        const im = document.querySelector("#stage img");
        if (im) im.src = liveUrl;
      }
    } else if (liveFresh) { liveFresh = false; render(); }
  } catch (e) { if (liveFresh) { liveFresh = false; render(); } }
  setTimeout(livePoll, 320);
}
livePoll();
</script>
</body>
</html>
